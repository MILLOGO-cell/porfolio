[variables]
NIXPACKS_INSTALL_CMD = "npm install"
NIXPACKS_BUILD_CMD = "npx prisma generate && npm run build"
NIXPACKS_NO_CACHE = "1"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["nodePackages.npm", "nodejs_22"]

[phases.install]
cmds = ["true"]
cache = []

[phases.build]
dependsOn = ["setup"]
cmds = ["npm install && npx prisma generate && npm run build"]
cache = []
