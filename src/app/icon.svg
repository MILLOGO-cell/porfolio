<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Icone d'onglet. Meme trace que src/components/Logo.tsx : toute retouche
    doit etre reportee dans les deux fichiers.

    Remplace un favicon.ico qui ne contenait qu'une entree 78 x 78, taille non
    standard que les navigateurs reechantillonnaient.
  -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f0939"/>
      <stop offset="1" stop-color="#85199e"/>
    </linearGradient>
    <linearGradient id="chevronGauche" x1="0.5" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2b7fb4"/>
      <stop offset="1" stop-color="#3fd3c6"/>
    </linearGradient>
    <linearGradient id="chevronDroit" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#e8452f"/>
      <stop offset="1" stop-color="#f79420"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="32" fill="url(#fond)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="30.6,17.2 19.1,26.8 29.6,36.3" stroke="url(#chevronGauche)" stroke-width="4.6"/>
    <line x1="38.2" y1="17.2" x2="28.7" y2="46.8" stroke="#ffffff" stroke-width="4"/>
    <polyline points="36.3,28.7 46.8,37.7 37.2,46.8" stroke="url(#chevronDroit)" stroke-width="4.6"/>
  </g>
</svg>
