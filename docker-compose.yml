services:
  db:
    image: postgres:16
    container_name: portfolio_db_dev
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      PORTFOLIO_DB_PASSWORD: ${PORTFOLIO_DB_PASSWORD:?définir PORTFOLIO_DB_PASSWORD dans .env}
    volumes:
      - portfolio_db_dev_data:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5433:5432" 
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 5
    command:
      - "postgres"
      - "-c"
      - "listen_addresses=*"

volumes:
  portfolio_db_dev_data: